# =============================================
# AWS Profile - API Gateway
# Activated via: SPRING_PROFILES_ACTIVE=aws
# =============================================
server:
  port: 9080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service.cms.local:8081
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://user-service.cms.local:8082
          predicates:
            - Path=/api/users/**
          filters:
            - AuthenticationFilter
        - id: account-service
          uri: http://account-service.cms.local:9083
          predicates:
            - Path=/api/accounts/**
          filters:
            - AuthenticationFilter
        - id: transfer-service
          uri: http://transfer-service.cms.local:8084
          predicates:
            - Path=/api/transfers/**
          filters:
            - AuthenticationFilter
        - id: payroll-service
          uri: http://payroll-service.cms.local:8085
          predicates:
            - Path=/api/payroll/**
          filters:
            - AuthenticationFilter

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.cms: INFO
