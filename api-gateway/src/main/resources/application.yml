server:
  port: 9080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**
          filters:
            - AuthenticationFilter
        - id: account-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/accounts/**
          filters:
            - AuthenticationFilter
        - id: transfer-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/transfers/**
          filters:
            - AuthenticationFilter
        - id: payroll-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/payroll/**
          filters:
            - AuthenticationFilter

jwt:
  secret: MySuperSecretKeyForJwtWhichIsLongEnoughForHmacSHA256SignatureAlgorithm2026!


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
