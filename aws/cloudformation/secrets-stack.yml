AWSTemplateFormatVersion: '2010-09-09'
Description: 'CMS Microservices - Secrets Manager'

Parameters:
  EnvironmentName:
    Type: String
    Default: cms-prod

  DBUsername:
    Type: String
    Default: cmsadmin
    Description: Master username for RDS

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Master password for RDS (min 8 characters)

  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: JWT signing secret key

Resources:
  # ============================================
  # Database Credentials Secret
  # ============================================
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentName}/database'
      Description: RDS MySQL credentials for CMS Microservices
      SecretString: !Sub |
        {
          "username": "${DBUsername}",
          "password": "${DBPassword}",
          "engine": "mysql",
          "port": 3306
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ============================================
  # JWT Secret
  # ============================================
  JwtSecretValue:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentName}/jwt'
      Description: JWT signing secret for CMS Auth Service
      SecretString: !Sub |
        {
          "secret": "${JwtSecret}"
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  DatabaseSecretArn:
    Description: ARN of the database secret
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${EnvironmentName}-DatabaseSecretArn'

  JwtSecretArn:
    Description: ARN of the JWT secret
    Value: !Ref JwtSecretValue
    Export:
      Name: !Sub '${EnvironmentName}-JwtSecretArn'
