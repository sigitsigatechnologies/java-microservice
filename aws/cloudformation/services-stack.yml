        Fn::ImportValue: !Sub '${EnvironmentName}-ECSTaskExecutionRoleArn'
      TaskRoleArn:
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSTaskRoleArn'
      ContainerDefinitions:
        - Name: notification-service
          Image: !Sub '${AWSAccountId}.dkr.ecr.${AWSRegion}.amazonaws.com/${EnvironmentName}/notification-service:latest'
          Essential: true
          PortMappings:
            - ContainerPort: 8087
              Protocol: tcp
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: aws
            - Name: RDS_HOSTNAME
              Value: !Ref RDSEndpoint
            - Name: RDS_PORT
              Value: '3306'
            - Name: RDS_USERNAME
              Value: !Ref RDSUsername
            - Name: RDS_PASSWORD
              Value: !Ref RDSPassword
            - Name: KAFKA_BOOTSTRAP_SERVERS
              Value: kafka.cms.local:9092
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${EnvironmentName}-LogGroupName'
              awslogs-region: !Ref AWSRegion
              awslogs-stream-prefix: notification-service

  NotificationECSService:
    Type: AWS::ECS::Service
    DependsOn: KafkaService
    Properties:
      ServiceName: notification-service
      Cluster:
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSClusterArn'
      TaskDefinition: !Ref NotificationServiceTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub '${EnvironmentName}-ECSTasksSecurityGroupId'
            - Fn::ImportValue: !Sub '${EnvironmentName}-ECSToRDSSecurityGroupId'
          Subnets:
            - Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet1Id'
            - Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet2Id'
      ServiceRegistries:
        - RegistryArn: !GetAtt NotificationServiceDiscovery.Arn

Outputs:
  ApiGatewayRepoUri:
    Description: ECR URI for API Gateway
    Value: !GetAtt ApiGatewayRepo.RepositoryUri

  AuthServiceRepoUri:
    Description: ECR URI for Auth Service
    Value: !GetAtt AuthServiceRepo.RepositoryUri

  UserServiceRepoUri:
    Description: ECR URI for User Service
    Value: !GetAtt UserServiceRepo.RepositoryUri

  AccountServiceRepoUri:
    Description: ECR URI for Account Service
    Value: !GetAtt AccountServiceRepo.RepositoryUri

  TransferServiceRepoUri:
    Description: ECR URI for Transfer Service
    Value: !GetAtt TransferServiceRepo.RepositoryUri

  PayrollServiceRepoUri:
    Description: ECR URI for Payroll Service
    Value: !GetAtt PayrollServiceRepo.RepositoryUri

  TransactionServiceRepoUri:
    Description: ECR URI for Transaction Service
    Value: !GetAtt TransactionServiceRepo.RepositoryUri

  NotificationServiceRepoUri:
    Description: ECR URI for Notification Service
    Value: !GetAtt NotificationServiceRepo.RepositoryUri
