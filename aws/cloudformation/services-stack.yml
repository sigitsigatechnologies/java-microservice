      ExecutionRoleArn:
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSTaskExecutionRoleArn'
      TaskRoleArn:
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSTaskRoleArn'
      ContainerDefinitions:
        - Name: user-service
          Image: !Sub '${AWSAccountId}.dkr.ecr.${AWSRegion}.amazonaws.com/${EnvironmentName}/user-service:latest'
          Essential: true
          PortMappings:
            - ContainerPort: 8082
              Protocol: tcp
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: aws
            - Name: RDS_HOSTNAME
              Value: !Ref RDSEndpoint
            - Name: RDS_PORT
              Value: '3306'
            - Name: RDS_USERNAME
              Value: !Ref RDSUsername
            - Name: RDS_PASSWORD
              Value: !Ref RDSPassword
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${EnvironmentName}-LogGroupName'
              awslogs-region: !Ref AWSRegion
              awslogs-stream-prefix: user-service

  UserECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: user-service
      Cluster:
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSClusterArn'
      TaskDefinition: !Ref UserServiceTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub '${EnvironmentName}-ECSTasksSecurityGroupId'
            - Fn::ImportValue: !Sub '${EnvironmentName}-ECSToRDSSecurityGroupId'
          Subnets:
            - Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet1Id'
            - Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet2Id'
      ServiceRegistries:
        - RegistryArn: !GetAtt UserServiceDiscovery.Arn

  # ============================================
  # ACCOUNT SERVICE - Task Definition & Service
  # ============================================
  AccountServiceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-account-service'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref ServiceCpu
      Memory: !Ref ServiceMemory
      ExecutionRoleArn:
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSTaskExecutionRoleArn'
      TaskRoleArn:
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSTaskRoleArn'
      ContainerDefinitions:
        - Name: account-service
          Image: !Sub '${AWSAccountId}.dkr.ecr.${AWSRegion}.amazonaws.com/${EnvironmentName}/account-service:latest'
          Essential: true
          PortMappings:
