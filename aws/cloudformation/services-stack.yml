  # ============================================
  TransactionServiceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-transaction-service'
      NetworkMode: awsvpc
      RequiresCompatibilities:
