              Protocol: tcp
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: aws
            - Name: RDS_HOSTNAME
              Value: !Ref RDSEndpoint
            - Name: RDS_PORT
              Value: '3306'
            - Name: RDS_USERNAME
              Value: !Ref RDSUsername
            - Name: RDS_PASSWORD
              Value: !Ref RDSPassword
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${EnvironmentName}-LogGroupName'
              awslogs-region: !Ref AWSRegion
              awslogs-stream-prefix: account-service

  AccountECSService:
    Type: AWS::ECS::Service
    Properties:
