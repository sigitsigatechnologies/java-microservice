          Image: !Sub '${AWSAccountId}.dkr.ecr.${AWSRegion}.amazonaws.com/${EnvironmentName}/transfer-service:latest'
          Essential: true
          PortMappings:
            - ContainerPort: 8084
              Protocol: tcp
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: aws
            - Name: RDS_HOSTNAME
              Value: !Ref RDSEndpoint
            - Name: RDS_PORT
              Value: '3306'
            - Name: RDS_USERNAME
              Value: !Ref RDSUsername
            - Name: RDS_PASSWORD
              Value: !Ref RDSPassword
            - Name: KAFKA_BOOTSTRAP_SERVERS
              Value: kafka.cms.local:9092
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${EnvironmentName}-LogGroupName'
              awslogs-region: !Ref AWSRegion
              awslogs-stream-prefix: transfer-service

  TransferECSService:
